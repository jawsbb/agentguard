[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Checkpoint, detect, recover — make any AI agent production-ready"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jules Koehler" }
]
keywords = [
    "ai",
    "agents",
    "llm",
    "reliability",
    "checkpoint",
    "recovery",
    "mcp",
    "claude",
    "production"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[project.urls]
Homepage = "https://github.com/jawsbb/agentguard"
Documentation = "https://github.com/jawsbb/agentguard#readme"
Repository = "https://github.com/jawsbb/agentguard"
Issues = "https://github.com/jawsbb/agentguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
